version: '3.8'

services:
  neo4j:
    image: neo4j:5.12.0-community
    container_name: self_healing_neo4j
    ports:
      - "7474:7474" # Neo4j Browser Web Interface Dashboard
      - "7687:7687" # Bolt Protocol database connection port
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/password123 # Core database credentials
      - NEO4J_PLUGINS=["apoc"]         # Enable Advanced Path Ingestion utilities

volumes:
  neo4j_data:
  neo4j_logs: